<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M4AE2 ABP2</title>
    <link rel="stylesheet" href="./assets/css/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">

</head>

<body>
    <section class="cards">
        <div class="card">
            <h3>Ejercicio JS1</h3>
            <p class="autor"> CONVERTIDOR DE USD A CLP </p>
<div class="cardUSD"></div>
                    <p class="dolares">Ingrese la cantidad en dólares:</p>
                    <input type="number" name="Ingrese monto" id="dolares" step="0.01" min="0" placeholder="Ej: 10.50">
                    <center><button class="btn-agregar" id="convertir">Convertir</button></center>
                    <div id="resultado"></div>
        </div>

        <div class="card">
            <h3>Ejercicio JS2</h3>
            <p class="autor"> SUBSIDIO DE ARRIENDO DE VIVIENDA </p>
            <div class="cardUF"></div>
            <p class="uf">Ingrese su edad:</p>
            <input type="number" name="Ingrese edad" id="edad" step="1" min="0" placeholder="Ej: 24">
            <p class="tieneCedula">¿Tiene cédula de identidad chilena?</p>
            <input type="checkbox" name="tieneCedula" id="tieneCedula" value="true">
            <p class="tieneCedula">Ingrese cantidad de UF ahorrado:</p>
            <input type="number" name="Ingrese UF" id="uf" step="1" min="0" placeholder="Ej: 3">
            <p class= "porcentajeVulnerable">Ingrese porcentaje de vulnerabilidad:</p>
            <input type="number" name="porcentajeVulnerable" id="porcentajeVulnerable" step="1" min="0" max="100" placeholder="Ej: 50">
            <center><button class="btn-agregar" id="calcular">Submit</button></center>
            <div id="resultadoUF"></div>
        </div>
    </section>






<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
<script src="./assets/JS/main.js"></script>
</body>
</html>
